# =============================================================
# docker-compose.prod.yml — PRODUCCIÓN (para EC2)
# Uso: docker compose -f docker-compose.prod.yml --env-file .env.docker up -d
# Requiere: .env.docker con los valores reales de producción
# =============================================================

services:

  # -----------------------------------------------------------
  # Frontend — Build estático servido por Nginx + SSL (443/80)
  # -----------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner           # Stage final con Nginx
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_API_URL: ${VITE_API_URL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # nginx.conf se monta desde el host para permitir cambios sin rebuild
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Certificados SSL generados por Certbot
      - certbot-certs:/etc/letsencrypt:ro
      # Directorio raíz para el webroot-challenge de Certbot (renovación)
      - certbot-www:/var/www/certbot:ro
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - jci-network

  # -----------------------------------------------------------
  # Certbot — Genera y renueva certificados Let's Encrypt
  # -----------------------------------------------------------
  certbot:
    image: certbot/certbot:latest
    volumes:
      # Comparte el mismo volumen de certificados con Nginx
      - certbot-certs:/etc/letsencrypt
      # Comparte el webroot para el challenge HTTP-01
      - certbot-www:/var/www/certbot
    # Renueva automáticamente cada 12 horas (Let's Encrypt expira a los 90 días)
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot --webroot-path=/var/www/certbot --quiet; sleep 12h & wait $${!}; done"
    restart: unless-stopped

  # -----------------------------------------------------------
  # Backend — FastAPI producción (sin --reload)
  # -----------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Puerto 8000 solo expuesto internamente — accedido via proxy Nginx en /api/
    expose:
      - "8000"
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - GCP_PROJECT_ID=${GCP_PROJECT_ID:-}
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - ENVIRONMENT=production
      - IA_DIAGNOSTICO_URL=http://ia-diagnostico:9000
      - EMAIL_SENDER=${EMAIL_SENDER}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
    restart: unless-stopped
    depends_on:
      ia-diagnostico:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - jci-network

  # -----------------------------------------------------------
  # IA Diagnóstico — Producción (sin puerto expuesto al exterior)
  # -----------------------------------------------------------
  ia-diagnostico:
    build:
      context: ./IA
      dockerfile: Dockerfile
    command: ["adk", "api_server", ".", "--port", "9000", "--host", "0.0.0.0"]
    # Puerto NO expuesto al host — solo accesible internamente por el backend
    expose:
      - "9000"
    environment:
      - GOOGLE_GENAI_USE_VERTEXAI=${GOOGLE_GENAI_USE_VERTEXAI:-FALSE}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - BACKEND_URL=http://backend:8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/list-apps')"]
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 40s
    networks:
      - jci-network

networks:
  jci-network:
    driver: bridge

volumes:
  # Volumen persistente para certificados SSL (sobrevive reinicios de contenedores)
  certbot-certs:
  # Volumen compartido para el webroot challenge de Certbot
  certbot-www:
